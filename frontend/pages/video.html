<link rel="stylesheet" href="..\css\pages\video.css">
<div id="container">
    <div id="content-container">
        <video id="video-display" src="..\resources\mockVid.mp4" autoplay>Video is loading...</video>
        <input type="range" id="seek-bar" min="0" max="1000" value="0">
        <div id="controls">
            <button id="back">↺</button>
            <button id="play">⏸</button>
            <button id="forward">↻</button>
        </div>
    </div>
    <button id="delete-button" no-highlight>🗙</button>
        <dialog id="delete-dialog">
        <div id="delete-dialog-container">
            <div id="delete-text-container">
                <h1>Do you want to delete this video?</h1>
                <h2>This action cannot be undone.</h2>
                <h2>The video can be recompiled if the gallery still exists.</h2>
            </div>
            <div id="delete-button-container">
                <button id="delete-confirm">Yes</button>
                <button id="delete-cancel">Cancel</button>
            </div>
        </div>
    </dialog>
</div>
