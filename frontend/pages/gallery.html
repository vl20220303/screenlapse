<link rel="stylesheet" href="..\css\pages\gallery.css">
<div id="container">
    <div id="content-container">
        <img id="image-display" no-highlight>
        <div id="carousel" no-highlight></div>
        <div id="controls">
            <button id="img-back" no-highlight>‹</button>
            <div id="index-selector">
                <input id="index-input" value="1" autocomplete="off">
                <h1> of </h1>
                <h1 id="total-number-imgs">1</h1>
            </div>
            <button id="img-forward" no-highlight>›</button>
        </div>
    </div>
    <button id="delete-button" no-highlight>🗙</button>
    <dialog id="delete-dialog">
        <div id="delete-dialog-container">
            <div id="delete-text-container">
                <h1>Do you want to delete this image gallery?</h1>
                <h2>This action cannot be undone.</h2>
            </div>
            <div id="delete-button-container">
                <button id="delete-confirm">Yes</button>
                <button id="delete-cancel">Cancel</button>
            </div>
        </div>
    </dialog>
</div>
