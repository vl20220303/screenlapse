<link rel="stylesheet" href="../css/pages/setup.css">
<div id="container">
    <img id="setup-icon" src="../resources/setup.webp" no-highlight></img>
    <div id="setup-container">
        <h1 no-highlight>SETUP</h1>
        <p>Choose where recordings will be stored. You can change this anytime.</p>
        <div id="browse-container" no-highlight>
            <input id="path-input" value="Select a path..." readonly>
            <button id="browse-button">Browse</button>
        </div>
        <div id="theme-container" no-highlight>
            <button id="light-theme" class="theme-button">L</button>
            <button id="system-theme" class="theme-button">S</button>
            <button id="dark-theme" class="theme-button">D</button>
        </div>
        <div id="theme-descriptor">Select a theme.</div>
        <button id="setup-button" no-highlight>Finish setup</button>
    </div>
</div>
